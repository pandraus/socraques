services:
  - type: web
    name: socraques
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PITCHSTAT_PASSWORD
        value: pitch2026
      - key: HOST
        value: "0.0.0.0"
